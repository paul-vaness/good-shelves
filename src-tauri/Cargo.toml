[package]
name = "good-shelves"
version = "1.1.0"
license = "MIT"
description = "good shelves — local multimodal semantic search and organization system for personal file management"
authors = [
  "Paul Vaness B. Ramos",
  "Ishee Margareth B. Esteleydes",
  "Ayessa S. Digno"
]
edition = "2021"

[lib]
name = "good_shelves_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
notify = "8"
trash = "5.2.9"
similar = "2.6"
dirs = "5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
