name: CI & Cross-Platform Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Frontend typecheck & build
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build

      - name: Python engine tests
        run: |
          python -m pip install --upgrade pip
          pip install -r python-engine/requirements.txt
          python -m pytest python-engine/tests/ -v

      - name: Rust backend tests & clippy
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_label: linux-x64
            bundles: deb,appimage
            release_config: src-tauri/tauri.linux.release.conf.json
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_label: windows-x64
            bundles: msi,nsis
            release_config: src-tauri/tauri.release.conf.json

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python engine & PyInstaller dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-engine/requirements.txt

      - name: Provision offline ONNX models
        run: python scripts/setup_models.py --download --release-stage

      - name: Build bundled Python sidecar binary
        run: python scripts/build_sidecar.py --target ${{ matrix.target }}

      - name: Build Tauri application (and publish Release on tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Good Shelves v__VERSION__"
          releaseBody: "Offline multimodal semantic file manager for Linux (.AppImage, .deb) and Windows (.msi, .exe)."
          releaseDraft: false
          prerelease: false
          args: --config ${{ matrix.release_config }} --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          mkdir -p release-checksums
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.msi" -o -name "*.exe" \) -exec sha256sum {} + > release-checksums/SHA256SUMS-${{ matrix.platform_label }}.txt
          cat release-checksums/SHA256SUMS-${{ matrix.platform_label }}.txt

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: good-shelves-${{ matrix.platform_label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            release-checksums/SHA256SUMS-${{ matrix.platform_label }}.txt
          if-no-files-found: warn
